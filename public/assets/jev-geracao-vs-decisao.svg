<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Comparação entre geração autorregressiva token a token e uma decisão estruturada devolvida de uma vez">
  <style>
    .bg   { fill: #ffffff; }
    .panel{ fill: #f6f7f9; stroke: #e3e6ea; }
    .ink  { fill: #111827; }
    .mut  { fill: #6b7280; }
    .tok  { fill: #ffffff; stroke: #cbd5e1; }
    .out  { fill: #f5f0ff; stroke: #7c3aed; }
    .arrow{ stroke: #94a3b8; }
    .head { fill: #94a3b8; }
    .slow { fill: #dc2626; }
    .fast { fill: #059669; }
    .rule { stroke: #e3e6ea; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .panel{ fill: #12171f; stroke: #262d38; }
      .ink  { fill: #e6edf3; }
      .mut  { fill: #9aa4b2; }
      .tok  { fill: #161b22; stroke: #39414d; }
      .out  { fill: #221a33; stroke: #a78bfa; }
      .arrow{ stroke: #5b6674; }
      .head { fill: #5b6674; }
      .slow { fill: #f87171; }
      .fast { fill: #34d399; }
      .rule { stroke: #262d38; }
    }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="330"/>

  <!-- TOP: autoregressive -->
  <rect class="panel" x="20" y="18" width="860" height="132" rx="14"/>
  <text class="ink" x="40" y="46" font-size="15" font-weight="700">LLM: uma palavra de cada vez</text>
  <text class="mut" x="40" y="66" font-size="12.5">cada token depende do anterior, e a resposta só existe quando a última peça chega</text>

  <g>
    <rect class="tok" x="40"  y="86" width="86" height="34" rx="8"/><text class="ink mono" x="83"  y="108" font-size="12" text-anchor="middle">{"setor"</text>
    <line x1="130" y1="103" x2="146" y2="103" class="arrow" stroke-width="1.6" marker-end="url(#b)"/>
    <rect class="tok" x="150" y="86" width="40" height="34" rx="8"/><text class="ink mono" x="170" y="108" font-size="12" text-anchor="middle">:</text>
    <line x1="194" y1="103" x2="210" y2="103" class="arrow" stroke-width="1.6" marker-end="url(#b)"/>
    <rect class="tok" x="214" y="86" width="112" height="34" rx="8"/><text class="ink mono" x="270" y="108" font-size="12" text-anchor="middle">"financ</text>
    <line x1="330" y1="103" x2="346" y2="103" class="arrow" stroke-width="1.6" marker-end="url(#b)"/>
    <rect class="tok" x="350" y="86" width="72" height="34" rx="8"/><text class="ink mono" x="386" y="108" font-size="12" text-anchor="middle">eiro"</text>
    <line x1="426" y1="103" x2="442" y2="103" class="arrow" stroke-width="1.6" marker-end="url(#b)"/>
    <rect class="tok" x="446" y="86" width="40" height="34" rx="8"/><text class="ink mono" x="466" y="108" font-size="12" text-anchor="middle">,</text>
    <line x1="490" y1="103" x2="506" y2="103" class="arrow" stroke-width="1.6" marker-end="url(#b)"/>
    <rect class="tok" x="510" y="86" width="120" height="34" rx="8"/><text class="ink mono" x="570" y="108" font-size="12" text-anchor="middle">"urgência"</text>
    <line x1="634" y1="103" x2="650" y2="103" class="arrow" stroke-width="1.6" marker-end="url(#b)"/>
    <text class="mut mono" x="660" y="108" font-size="13">…</text>
  </g>
  <text class="slow" x="700" y="108" font-size="14" font-weight="700">segundos</text>

  <!-- BOTTOM: structured -->
  <rect class="panel" x="20" y="170" width="860" height="142" rx="14"/>
  <text class="ink" x="40" y="198" font-size="15" font-weight="700">Jev: o espaço de respostas já existe antes da pergunta</text>
  <text class="mut" x="40" y="218" font-size="12.5">nada é escrito. cada campo recebe uma probabilidade, todos ao mesmo tempo</text>

  <rect class="out" x="40" y="238" width="250" height="52" rx="10" stroke-width="1.5"/>
  <text class="ink mono" x="56" y="260" font-size="12.5">setor = financeiro</text>
  <text class="mut mono" x="56" y="279" font-size="12">confiança 0.98</text>

  <rect class="out" x="304" y="238" width="250" height="52" rx="10" stroke-width="1.5"/>
  <text class="ink mono" x="320" y="260" font-size="12.5">urgência = alta</text>
  <text class="mut mono" x="320" y="279" font-size="12">confiança 0.91</text>

  <rect class="out" x="568" y="238" width="250" height="52" rx="10" stroke-width="1.5"/>
  <text class="ink mono" x="584" y="260" font-size="12.5">precisa_humano = sim</text>
  <text class="mut mono" x="584" y="279" font-size="12">confiança 0.74</text>

  <text class="fast" x="832" y="222" font-size="14" font-weight="700" text-anchor="end">70 a 500 ms</text>
</svg>
