<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Diagrama comparando uma arquitetura em que o LLM faz tudo com outra em que o LLM conversa e o Jev decide">
  <style>
    :root { color-scheme: light dark; }
    .bg   { fill: #ffffff; }
    .panel{ fill: #f6f7f9; stroke: #e3e6ea; }
    .ink  { fill: #111827; }
    .mut  { fill: #6b7280; }
    .box  { fill: #ffffff; stroke: #cbd5e1; }
    .llm  { fill: #eef2ff; stroke: #6366f1; }
    .jev  { fill: #f5f0ff; stroke: #7c3aed; }
    .sys  { fill: #ecfdf5; stroke: #059669; }
    .arrow{ stroke: #94a3b8; }
    .head { fill: #94a3b8; }
    .badgeA { fill: #6366f1; }
    .badgeB { fill: #7c3aed; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .panel{ fill: #12171f; stroke: #262d38; }
      .ink  { fill: #e6edf3; }
      .mut  { fill: #9aa4b2; }
      .box  { fill: #161b22; stroke: #39414d; }
      .llm  { fill: #1b1f36; stroke: #818cf8; }
      .jev  { fill: #221a33; stroke: #a78bfa; }
      .sys  { fill: #10241d; stroke: #34d399; }
      .arrow{ stroke: #5b6674; }
      .head { fill: #5b6674; }
      .badgeA { fill: #818cf8; }
      .badgeB { fill: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="360"/>

  <!-- LANE A -->
  <rect class="panel" x="20" y="20" width="860" height="140" rx="14"/>
  <rect class="badgeA" x="36" y="36" width="10" height="10" rx="5"/>
  <text class="ink" x="56" y="46" font-size="15" font-weight="700">Como quase todo mundo faz hoje</text>
  <text class="mut" x="56" y="66" font-size="13">um modelo de linguagem escreve o texto E também toma as decisões do sistema</text>

  <rect class="box" x="44" y="88" width="150" height="50" rx="10"/>
  <text class="ink" x="119" y="118" font-size="14" text-anchor="middle">Cliente escreve</text>

  <line x1="200" y1="113" x2="248" y2="113" class="arrow" stroke-width="2" marker-end="url(#a)"/>

  <rect class="llm" x="254" y="80" width="330" height="66" rx="10" stroke-width="1.5"/>
  <text class="ink" x="419" y="106" font-size="14" font-weight="600" text-anchor="middle">LLM (ChatGPT / Claude / Gemini)</text>
  <text class="mut" x="419" y="128" font-size="12.5" text-anchor="middle">conversa + classifica + prioriza + decide, tudo em texto</text>

  <line x1="590" y1="113" x2="638" y2="113" class="arrow" stroke-width="2" marker-end="url(#a)"/>

  <rect class="sys" x="644" y="88" width="212" height="50" rx="10" stroke-width="1.5"/>
  <text class="ink" x="750" y="112" font-size="14" text-anchor="middle">Sistema executa</text>
  <text class="mut" x="750" y="129" font-size="11.5" text-anchor="middle">torcendo pro JSON vir certo</text>

  <!-- LANE B -->
  <rect class="panel" x="20" y="184" width="860" height="156" rx="14"/>
  <rect class="badgeB" x="36" y="200" width="10" height="10" rx="5"/>
  <text class="ink" x="56" y="210" font-size="15" font-weight="700">O que o Jev propõe</text>
  <text class="mut" x="56" y="230" font-size="13">o modelo de linguagem fala; o modelo System One decide</text>

  <rect class="box" x="44" y="256" width="132" height="56" rx="10"/>
  <text class="ink" x="110" y="288" font-size="14" text-anchor="middle">Cliente escreve</text>

  <line x1="182" y1="284" x2="222" y2="284" class="arrow" stroke-width="2" marker-end="url(#a)"/>

  <rect class="llm" x="228" y="252" width="176" height="64" rx="10" stroke-width="1.5"/>
  <text class="ink" x="316" y="278" font-size="13.5" font-weight="600" text-anchor="middle">LLM conversa</text>
  <text class="mut" x="316" y="298" font-size="11.5" text-anchor="middle">empatia, redação, contexto</text>

  <line x1="410" y1="284" x2="450" y2="284" class="arrow" stroke-width="2" marker-end="url(#a)"/>

  <rect class="jev" x="456" y="252" width="200" height="64" rx="10" stroke-width="1.5"/>
  <text class="ink" x="556" y="278" font-size="13.5" font-weight="600" text-anchor="middle">Jev decide</text>
  <text class="mut" x="556" y="298" font-size="11.5" text-anchor="middle">setor 98% · urgência 91% · humano 74%</text>

  <line x1="662" y1="284" x2="702" y2="284" class="arrow" stroke-width="2" marker-end="url(#a)"/>

  <rect class="sys" x="708" y="252" width="148" height="64" rx="10" stroke-width="1.5"/>
  <text class="ink" x="782" y="278" font-size="13.5" text-anchor="middle">Sistema executa</text>
  <text class="mut" x="782" y="298" font-size="11.5" text-anchor="middle">com regra e threshold</text>
</svg>
