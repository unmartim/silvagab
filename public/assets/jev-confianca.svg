<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Faixas de confiança convertidas em regras: bloquear automaticamente, revisar com humano ou deixar passar">
  <style>
    .bg   { fill: #ffffff; }
    .panel{ fill: #f6f7f9; stroke: #e3e6ea; }
    .ink  { fill: #111827; }
    .mut  { fill: #6b7280; }
    .track{ fill: #eef1f5; }
    .red  { fill: #fee2e2; stroke: #dc2626; }
    .amb  { fill: #fef3c7; stroke: #d97706; }
    .grn  { fill: #dcfce7; stroke: #059669; }
    .tick { stroke: #cbd5e1; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .panel{ fill: #12171f; stroke: #262d38; }
      .ink  { fill: #e6edf3; }
      .mut  { fill: #9aa4b2; }
      .track{ fill: #1b212b; }
      .red  { fill: #2a1416; stroke: #f87171; }
      .amb  { fill: #2a2110; stroke: #fbbf24; }
      .grn  { fill: #0f241b; stroke: #34d399; }
      .tick { stroke: #39414d; }
    }
  </style>

  <rect class="bg" width="900" height="300"/>
  <rect class="panel" x="20" y="18" width="860" height="264" rx="14"/>

  <text class="ink" x="44" y="52" font-size="16" font-weight="700">A confiança não é enfeite. É a regra de negócio.</text>
  <text class="mut" x="44" y="74" font-size="13">a pergunta é “esta transação é fraude?”. a resposta vem com uma probabilidade, e você decide o que fazer com cada faixa</text>

  <!-- track -->
  <rect class="track" x="44" y="104" width="812" height="46" rx="10"/>
  <rect class="grn" x="44"  y="104" width="568" height="46" rx="10" stroke-width="1.5"/>
  <rect class="amb" x="612" y="104" width="203" height="46" rx="10" stroke-width="1.5"/>
  <rect class="red" x="815" y="104" width="41"  height="46" rx="10" stroke-width="1.5"/>

  <text class="ink" x="328" y="133" font-size="13.5" text-anchor="middle" font-weight="600">deixa passar</text>
  <text class="ink" x="713" y="133" font-size="13.5" text-anchor="middle" font-weight="600">revisão humana</text>
  <text class="ink" x="836" y="133" font-size="12" text-anchor="middle" font-weight="600">bloqueia</text>

  <!-- ticks -->
  <line x1="44"  y1="154" x2="44"  y2="168" class="tick" stroke-width="1.5"/>
  <line x1="612" y1="154" x2="612" y2="168" class="tick" stroke-width="1.5"/>
  <line x1="815" y1="154" x2="815" y2="168" class="tick" stroke-width="1.5"/>
  <line x1="856" y1="154" x2="856" y2="168" class="tick" stroke-width="1.5"/>
  <text class="mut mono" x="44"  y="184" font-size="12" text-anchor="middle">0%</text>
  <text class="mut mono" x="612" y="184" font-size="12" text-anchor="middle">70%</text>
  <text class="mut mono" x="815" y="184" font-size="12" text-anchor="middle">95%</text>
  <text class="mut mono" x="856" y="184" font-size="12" text-anchor="end">100%</text>

  <line x1="44" y1="208" x2="856" y2="208" class="tick" stroke-width="1"/>

  <text class="ink" x="44" y="236" font-size="13.5" font-weight="600">O detalhe que muda tudo: calibração</text>
  <text class="mut" x="44" y="258" font-size="12.5">um LLM também consegue dizer “97%”. O problema é que esse número costuma ser chute retórico.</text>
  <text class="mut" x="44" y="276" font-size="12.5">A promessa do Jev é que, no conjunto das respostas com 97%, aproximadamente 97% estejam certas.</text>
</svg>
